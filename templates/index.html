<!DOCTYPE html>
<html>
<head>
    <title>Attendance Management System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5f9;
            text-align: center;
            padding: 50px;
        }

        .container {
            background: white;
            padding: 40px;
            max-width: 600px;
            margin: auto;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            color: #2563eb;
        }

        button {
            padding: 12px 25px;
            margin: 10px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Attendance Management System</h1>

    <p>Welcome to the Attendance Management System</p>

    <button>Student Login</button>
    <button>Teacher Login</button>
    <button>View Attendance</button>
</div>

</body>
</html>
